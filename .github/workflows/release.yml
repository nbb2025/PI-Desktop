# Release pipeline
#
# Trigger: push a tag `vX.Y.Z` (must match apps/desktop/package.json version).
# The easiest way to cut a release:
#
#   node scripts/release.mjs 0.2.0 --tag   # bump versions + commit + create tag v0.2.0
#   git push origin <branch> v0.2.0        # push → this workflow builds & publishes
#
# Publish one Windows NSIS installer for x86/x64 and one macOS Universal DMG.
# Installer checksums live in the release description.

name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      sign_macos:
        description: 'Sign with Developer ID and notarize macOS artifacts (set false for manual-install artifacts)'
        required: false
        default: true
        type: boolean

# Least privilege by default; only the publish job needs to write the release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  configuration:
    name: Resolve release signing
    runs-on: ubuntu-latest
    outputs:
      macos_signed: ${{ steps.signing.outputs.macos_signed }}
    steps:
      - id: signing
        name: Select the macOS signing lane
        env:
          SIGNING_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_macos }}
          SIGNING_DISABLED: ${{ github.event_name == 'workflow_dispatch' && !inputs.sign_macos }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ "$SIGNING_DISABLED" == "true" ]]; then
            echo "macos_signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          credentials=(CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID)
          missing=()
          for secret in "${credentials[@]}"; do
            [[ -n "${!secret}" ]] || missing+=("$secret")
          done
          if ((${#missing[@]} == 0)); then
            [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::Invalid APPLE_TEAM_ID"; exit 1; }
            echo "macos_signed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$SIGNING_REQUIRED" == "true" ]] || ((${#missing[@]} != ${#credentials[@]})); then
            echo "::error::Incomplete macOS signing configuration: ${missing[*]}"
            exit 1
          else
            echo "::notice::macOS will be published for manual installation."
            echo "macos_signed=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    # Same gate as ci.yml. A tag push does not trigger ci.yml, so without this
    # job a broken tree could be built and published untested.
    name: Verify (build / typecheck / lint / test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:js

      - name: Typecheck Desktop
        run: pnpm --filter @pi-desktop/desktop typecheck

      - name: Verify stable release documentation
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        run: pnpm check:release-docs

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm -r --if-present test

      - name: Rust host-core test
        run: cargo test -p host-core --locked

  build:
    name: Build ${{ matrix.name }}
    needs: [configuration, verify]
    env:
      MACOS_SIGN_RELEASE: ${{ needs.configuration.outputs.macos_signed }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal
            os: macos-15-intel
            artifact: mac
            platform: macos
            rust_targets: x86_64-apple-darwin,aarch64-apple-darwin
          - name: Windows Universal
            os: windows-latest
            artifact: windows
            platform: windows
            rust_targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Compare tag with apps/desktop/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match apps/desktop/package.json version $APP_VERSION."
            echo "Run 'node scripts/release.mjs $TAG_VERSION --tag' to bump versions before tagging."
            exit 1
          fi

      - name: Validate bundled models.dev catalog
        run: |
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          const path = 'apps/desktop/resources/models.dev/api.json';
          const catalog = JSON.parse(await readFile(path, 'utf8'));
          const valid = catalog && !Array.isArray(catalog) && typeof catalog === 'object' &&
            Object.values(catalog).some((provider) => provider && typeof provider === 'object' && provider.models);
          if (!valid) throw new Error(`${path} contains no provider model records`);
          console.log(`${path} is valid`);
          NODE

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Match the Node that Electron 43 bundles (24.18), so the released
          # artifacts are built against the runtime the app actually ships.
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package universal Windows installer
        if: matrix.platform == 'windows'
        run: pnpm --filter @pi-desktop/desktop run dist:win

      - name: Package macOS manual-install bundle
        if: matrix.platform == 'macos' && env.MACOS_SIGN_RELEASE != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter @pi-desktop/desktop run dist:mac -c.mac.identity=-

      - name: Diagnose macOS signing environment
        # Records the runner baseline (system, codesign, identities, keychain,
        # Xcode tools, Apple timestamp reachability) before electron-builder
        # imports the certificate. Informational: the Developer ID identity is
        # absent here by design and is imported from CSC_LINK during packaging.
        if: matrix.platform == 'macos'
        run: scripts/macos-signing-diagnostics.sh

      - name: Package signed and notarized macOS installer
        if: matrix.platform == 'macos' && env.MACOS_SIGN_RELEASE == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # electron-builder prints one "signing PI-Desktop.app" line and then
          # goes quiet: @electron/osx-sign walks Contents and codesigns every
          # Mach-O serially, builder-util silently retries a failing pass up to
          # three times, and @electron/notarize zips, uploads, and waits for
          # Apple's queue. These two namespaces expose all three phases without
          # leaking credentials, because both render their own command lines
          # through a password filter. `electron-builder` itself is deliberately
          # absent: builder-util's `executing` debug line prints every spawned
          # command with only its own stem list redacted, and that list does not
          # cover `security set-key-partition-list -k <p12 password>`. The
          # watchdog redacts the secret values and any --password/-k argument on
          # top of that.
          DEBUG: "electron-osx-sign*,electron-notarize*"
          # 30 minutes keeps a stuck signing/notarization phase reported by the
          # watchdog (diagnostics + summary) inside the 60-minute job budget.
          PI_SIGNING_TIMEOUT_SECONDS: "1800"
          PI_SIGNING_STALL_SECONDS: "300"
          PI_STAPLER_MAX_ATTEMPTS: "6"
          PI_STAPLER_RETRY_DELAY_SECONDS: "10"
        run: |
          set -euo pipefail
          # The watchdog forwards every line unchanged and keeps the child's
          # exit code; it adds a heartbeat while the phase is silent, dumps the
          # active codesign target and process state when it stalls, reports
          # per-file codesign timings, and fails the step after
          # PI_SIGNING_TIMEOUT_SECONDS instead of waiting for the job timeout.
          node scripts/macos-signing-watchdog.mjs \
            --label "dist:mac-universal" \
            -- pnpm --filter @pi-desktop/desktop run dist:mac \
              -c.mac.forceCodeSigning=true \
              -c.mac.notarize=true

      - name: Analyze the packaged macOS app bundle
        # Reports the file / Mach-O / framework / nested-bundle counts that
        # determine how much work the signing phase had, on the exact bundle the
        # release just produced. Diagnosis only: continue-on-error keeps a
        # surprising bundle layout from failing a release.
        if: matrix.platform == 'macos'
        continue-on-error: true
        run: node scripts/macos-bundle-inventory.mjs apps/desktop/release

      - name: Notarize and staple the macOS DMG
        if: matrix.platform == 'macos' && env.MACOS_SIGN_RELEASE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 20 minutes bounds the second Apple wait; the packaging phase owns
          # the first one.
          PI_SIGNING_TIMEOUT_SECONDS: "1200"
          PI_SIGNING_STALL_SECONDS: "300"
        run: |
          set -euo pipefail
          # notarytool submit --wait blocks until Apple answers; the watchdog
          # keeps that wait observable and bounded.
          node scripts/macos-signing-watchdog.mjs \
            --label "notarize-dmg-universal" \
            -- scripts/notarize-and-staple-macos-release-dmg.sh apps/desktop/release

      - name: Verify signed and notarized macOS installer
        if: matrix.platform == 'macos' && env.MACOS_SIGN_RELEASE == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/verify-macos-release.sh apps/desktop/release

      - name: Verify Windows installer and both architectures
        if: matrix.platform == 'windows'
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="$(node -p "require('./apps/desktop/package.json').version")"
          name="PI-Desktop-Setup-$version.exe"
          installers=(apps/desktop/release/*.exe)
          test "${#installers[@]}" -eq 1
          test "${installers[0]}" = "apps/desktop/release/$name"
          test ! -e "${installers[0]}.blockmap"
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const [directory, expected] of [['win-unpacked', 0x8664], ['win-ia32-unpacked', 0x14c]]) {
            for (const binary of ['PI-Desktop.exe', 'resources/bin/pi-desktop-host-core.exe']) {
              const path = `apps/desktop/release/${directory}/${binary}`;
              const executable = readFileSync(path);
              const machine = executable.readUInt16LE(executable.readUInt32LE(0x3c) + 4);
              if (machine !== expected) throw new Error(`${path} has the wrong PE architecture`);
            }
          }
          NODE

      - name: Verify macOS universal application and artifacts
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          release=apps/desktop/release
          version="$(node -p "require('./apps/desktop/package.json').version")"
          app="$release/mac-universal/PI-Desktop.app"
          for arch in arm64 x86_64; do
            lipo "$app/Contents/MacOS/PI-Desktop" -verify_arch "$arch"
            lipo "$app/Contents/Resources/bin/pi-desktop-host-core" -verify_arch "$arch"
          done
          codesign --verify --deep --strict "$app"
          test -f "$release/PI-Desktop-$version-universal.dmg"
      - name: Upload desktop installer
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0
          path: |
            apps/desktop/release/PI-Desktop-*-universal.dmg
            apps/desktop/release/PI-Desktop-Setup-*.exe

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Prepare the installer checksums
        run: node scripts/write-desktop-release-notes.mjs "${GITHUB_REF_NAME#v}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: iAgent Desktop ${{ github.ref_name }}
          files: |
            dist/PI-Desktop-Setup-*.exe
            dist/PI-Desktop-*-universal.dmg
          body_path: desktop-release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
